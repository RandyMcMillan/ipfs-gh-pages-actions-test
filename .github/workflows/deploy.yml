name: Deploy IPFS site

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and deploy IPFS site
        id: deploy
        uses: RandyMcMillan/ipfs-gh-pages@8027bdd79e9ee0239155afb51500c6f66b0c5734
        with:
          node-version: '20'
          deploy: 'true'
